- name: >-
    🎴 Shikimori watch list and reading list - Favorites anime and currently
    watching
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_medias: anime
    plugin_shikimori_sections: favorites, lists
    plugin_shikimori_statuses: watching
    plugin_shikimori_limit: 2
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 🎴 Shikimori watch list and reading list - Favorites manga and ranobe
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_medias: manga, ranobe
    plugin_shikimori_sections: favorites
    plugin_shikimori_limit: 2
    use_mocked_data: 'yes'
    verify: 'yes'
- name: 🎴 Shikimori watch list and reading list - Achievements and stats
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_sections: achievements, stats
    plugin_shikimori_limit_achievements: 16
    use_mocked_data: 'yes'
    verify: 'yes'
