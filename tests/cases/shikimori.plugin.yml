- name: >-
    🎴 Shikimori watch list and reading list - Favorites animes
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_medias: anime
    plugin_shikimori_sections: favorites
    use_mocked_data: 'yes'
    verify: 'yes'
- name: >-
    🎴 Shikimori watch list and reading list - Favorites mangas and ranobe
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_medias: manga, ranobe
    plugin_shikimori_sections: favorites
    use_mocked_data: 'yes'
    verify: 'yes'
- name: >-
    🎴 Shikimori watch list and reading list - Lists watching and completed
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_medias: anime, manga
    plugin_shikimori_sections: lists
    plugin_shikimori_statuses: watching, completed
    plugin_shikimori_limit: 2
    use_mocked_data: 'yes'
    verify: 'yes'
- name: >-
    🎴 Shikimori watch list and reading list - Characters and people strips
  uses: lowlighter/metrics@latest
  with:
    token: NOT_NEEDED
    plugin_shikimori: 'yes'
    plugin_shikimori_user: whynothacked
    plugin_shikimori_sections: characters, people
    plugin_shikimori_people: seyu, mangakas
    plugin_shikimori_limit_characters: 22
    plugin_shikimori_limit_people: 22
    use_mocked_data: 'yes'
    verify: 'yes'
